[project]
name = "radio-test"
version = "0.1.0"
description = "Scans all 126 radio channels (0-125), measures acknowledgement rate and RSSI for each, then plots the results and suggests the best channels to use."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.33",
    "matplotlib",
    "numpy",
]
