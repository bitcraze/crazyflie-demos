[project]
name = "matrix-light-printer"
version = "0.1.0"
description = "Flies the Crazyflie in a grid pattern while changing its LED ring color to match pixels from an image, creating a light-painting photograph when captured with a long-exposure camera in a dark room."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.31",
    "matplotlib",
]
