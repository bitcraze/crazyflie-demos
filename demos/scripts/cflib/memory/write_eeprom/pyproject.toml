[project]
name = "write-eeprom"
version = "0.1.0"
description = "Connects to the Crazyflie, writes default configuration values to the first I2C EEPROM memory found, then reads them back to verify."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.33",
]
