[project]
name = "persistent-params-from-file"
version = "0.1.0"
description = "Reads a YAML file containing persistent parameter values and writes them all to the Crazyflie in one operation."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.31",
    "pyyaml",
]
