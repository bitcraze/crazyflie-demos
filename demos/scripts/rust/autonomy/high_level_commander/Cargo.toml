[package]
name = "high-level-commander"
version = "0.1.0"
edition = "2021"
description = "High-level commander demo using crazyflie-lib-rs"
publish = false

[[bin]]
name = "high_level_commander"
path = "high_level_commander.rs"

[dependencies]
crazyflie-lib  = "0.7.0"
crazyflie-link = "0.4.3"
tokio          = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
