[project]
name = "christmas-tree"
version = "0.1.0"
description = "Flies 8 Crazyflies in a coordinated spiral choreography that traces the outline of a Christmas tree (cone) in 3D space, with each drone orbiting at a different altitude and radius."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.31",
]
