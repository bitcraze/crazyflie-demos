[project]
name = "leader-follower"
version = "0.1.0"
description = "Flies two Crazyflies in a leader-follower scenario: the leader executes a pre-defined trajectory while the follower uses real-time position data to maintain a fixed distance from the leader."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.31",
]
