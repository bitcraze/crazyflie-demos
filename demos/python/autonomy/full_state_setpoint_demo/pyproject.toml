[project]
name = "full-state-setpoint-demo"
version = "0.1.0"
description = "Demonstrates sending full state control setpoints (position, velocity, acceleration, and orientation as a quaternion) to the Crazyflie."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.31",
    "scipy",
]
