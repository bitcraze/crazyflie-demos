description = "Hover the Crazyflie and push it around with your hands — the Multiranger deck detects objects closer than 0.2 m and commands velocity away from them."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.31",
]
