[project]
name = "read-l5"
version = "0.1.0"
description = "Reads the 8x8 pixel ToF image from the Multi-ranger deck's VL53L5 sensor and displays it as a live grayscale heatmap using matplotlib."
requires-python = ">=3.10"
dependencies = [
    "cflib @ git+https://github.com/bitcraze/crazyflie-lib-python.git@0.1.31",
    "matplotlib",
]
